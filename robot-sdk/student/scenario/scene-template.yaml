# Copy this file to my-scene.yaml. Do not edit the delivery baseline.
scenario_name: student_pick_transport
dry_run: true
simulate_detection: false
navigation_enabled: false

# Camera selection and ROS topics.
recognition_camera: d435i
grasp_camera: astra
rgb_topic: /astra_camera/rgb/image_raw
depth_topic: /astra_camera/depth/image_raw
camera_info_topic: /astra_camera/rgb/camera_info
aux_rgb_topic: /d435i/color/image_raw
aux_depth_topic: /d435i/aligned_depth_to_color/image_raw
aux_camera_info_topic: /d435i/aligned_depth_to_color/camera_info

# Calibration products. Student code must load these; coordinates are never
# copied into this file as a fixed object target.
astra_arm_calibration: /data/robot-host/astra-arm-calibration/astra-to-base.json
aux_ground_calibration: /data/robot-host/student/calibration/installed/aux-ground.json
aux_arm_calibration: /data/robot-host/student/calibration/installed/aux-arm.json

target_color: red
grasp_depth_m: 0.60
grasp_camera_x_m: 0.0
lateral_tolerance_m: 0.018
depth_tolerance_m: 0.04
final_lateral_tolerance_m: 0.012
final_depth_tolerance_m: 0.025
min_valid_depth_m: 0.18
max_valid_depth_m: 2.50
depth_scale_m: 0.001
sync_tolerance_s: 0.08
min_stable_frames: 5
alignment_stable_frames: 8
max_target_jump_px: 80.0
settle_time_s: 0.7
max_align_travel_m: 0.35
align_timeout_s: 25.0
lateral_sign: 1.0
forward_sign: 1.0
lateral_gain: 0.8
forward_speed: 0.035
lateral_speed_limit: 0.06

# Students must measure and validate these vehicle-specific values. The
# delivery intentionally contains no reference grasp sequence.
home_pulses: []
grasp_pulses: []
gripper_open_pulse:
gripper_close_pulse:
arm_duration_s: 4.0
lift_m: 0.03
require_servo_feedback: true
servo_tolerance_pulse: 15
servo_feedback_timeout_s: 2.5

cmd_vel_topic: /cmd_vel
odom_topic: /odom
move_base_action: /move_base

# [x, y, yaw] in the map frame. Leave empty until a real map is selected.
recognition_goal: []
grasp_goal: []
place_goal: []
return_goal: []
