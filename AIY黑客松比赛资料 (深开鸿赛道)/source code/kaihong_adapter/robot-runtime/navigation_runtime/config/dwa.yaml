DWAPlannerROS:
  holonomic_robot: true
  max_vel_x: 0.12
  min_vel_x: -0.08
  max_vel_y: 0.12
  min_vel_y: -0.12
  max_vel_trans: 0.12
  min_vel_trans: 0.03
  max_vel_theta: 0.35
  min_vel_theta: 0.08
  acc_lim_x: 0.30
  acc_lim_y: 0.30
  acc_lim_theta: 0.60
  vx_samples: 10
  vy_samples: 10
  vtheta_samples: 20
  sim_time: 1.5
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.03
  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true

