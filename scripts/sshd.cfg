{
    "jobs" : [{
            "name" : "param:bootevent.boot.completed=true",
            "condition" : "bootevent.boot.completed=true",
            "cmds" : [
                "start sshd"
            ]
        }
    ],
    "services" : [{
            "name" : "sshd",
            "path" : [
                "/bin/sh",
                "/data/robot-host/sshd-foreground.sh"
            ],
            "uid" : "root",
            "gid" : ["root", "shell", "log", "readproc"],
            "secon" : "u:r:su:s0",
            "sandbox" : 0,
            "start-mode" : "condition",
            "once" : 0
        }
    ]
}
