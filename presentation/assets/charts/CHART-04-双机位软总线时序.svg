<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'JetBrains Mono','IBM Plex Mono','SF Mono','Consolas',ui-monospace,monospace">
  <defs>
    <marker id="arrow-ink4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/>
    </marker>
    <marker id="arrow-accent4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#002FA7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="640" fill="#fafaf8"/>

  <!-- 标题 -->
  <text x="60" y="56" font-size="13" letter-spacing="2.4" fill="#0a0a0a" opacity="0.55">ARCHITECTURE · DUAL-CAMERA SOFTBUS</text>
  <text x="60" y="92" font-size="30" font-weight="700" fill="#0a0a0a" letter-spacing="0.5">双机位软总线时序</text>

  <!-- 双机位角色头部 -->
  <g>
    <rect x="150" y="130" width="220" height="56" rx="4" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="260" y="155" font-size="15" font-weight="700" fill="#0a0a0a" text-anchor="middle">哨兵</text>
    <text x="260" y="174" font-size="11" fill="#0a0a0a" opacity="0.55" text-anchor="middle">辅助板 · Gemini 335</text>

    <rect x="590" y="130" width="220" height="56" rx="4" fill="#002FA7" stroke="#002FA7" stroke-width="1.5"/>
    <text x="700" y="155" font-size="15" font-weight="700" fill="#fafaf8" text-anchor="middle">执勤员</text>
    <text x="700" y="174" font-size="11" fill="#fafaf8" opacity="0.85" text-anchor="middle">小车板 · 相机 + 机械臂</text>
  </g>

  <!-- 生命线 -->
  <g stroke="#0a0a0a" stroke-width="1" stroke-dasharray="3 5" opacity="0.35">
    <line x1="260" y1="186" x2="260" y2="590"/>
    <line x1="700" y1="186" x2="700" y2="590"/>
  </g>

  <!-- ① 哨兵：发现 -->
  <g>
    <rect x="205" y="210" width="110" height="40" rx="3" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="260" y="234" font-size="13" fill="#0a0a0a" text-anchor="middle">① 发现</text>
    <text x="330" y="234" font-size="11" fill="#0a0a0a" opacity="0.5">桌下 / 墙角视觉盲区目标</text>
  </g>

  <!-- ② 通报坐标：哨兵→执勤员 -->
  <g>
    <line x1="260" y1="290" x2="700" y2="290" stroke="#002FA7" stroke-width="2" marker-end="url(#arrow-accent4)"/>
    <text x="480" y="278" font-size="13" font-weight="600" fill="#002FA7" text-anchor="middle">② 通报坐标</text>
    <text x="480" y="308" font-size="11" fill="#0a0a0a" opacity="0.5" text-anchor="middle">软总线话题广播（M-Robots OS 分布式消息）</text>
  </g>

  <!-- ③ 执勤员：接单 -->
  <g>
    <rect x="645" y="340" width="110" height="40" rx="3" fill="none" stroke="#002FA7" stroke-width="1.5"/>
    <text x="700" y="364" font-size="13" fill="#002FA7" text-anchor="middle">③ 接单</text>
    <text x="620" y="364" font-size="11" fill="#0a0a0a" opacity="0.5" text-anchor="end">订阅坐标话题</text>
  </g>

  <!-- ④ 执勤员：处置 -->
  <g>
    <rect x="620" y="410" width="160" height="52" rx="3" fill="#002FA7" opacity="0.08" stroke="#002FA7" stroke-width="1.5"/>
    <text x="700" y="432" font-size="13" font-weight="600" fill="#002FA7" text-anchor="middle">④ 处置</text>
    <text x="700" y="450" font-size="11" fill="#0a0a0a" opacity="0.6" text-anchor="middle">导航靠近 + IK 抓取</text>
  </g>

  <!-- ⑤ 回报：执勤员→哨兵 -->
  <g>
    <line x1="700" y1="500" x2="260" y2="500" stroke="#0a0a0a" stroke-width="2" marker-end="url(#arrow-ink4)"/>
    <text x="480" y="488" font-size="13" font-weight="600" fill="#0a0a0a" text-anchor="middle">⑤ 回报</text>
    <text x="480" y="518" font-size="11" fill="#0a0a0a" opacity="0.5" text-anchor="middle">处置结果回传</text>
  </g>

  <!-- ⑥ 哨兵：出日志 -->
  <g>
    <rect x="205" y="550" width="110" height="40" rx="3" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="260" y="574" font-size="13" fill="#0a0a0a" text-anchor="middle">⑥ 出日志</text>
    <text x="330" y="574" font-size="11" fill="#0a0a0a" opacity="0.5">留存作业记录，供追溯</text>
  </g>

  <!-- 底部一句话 -->
  <text x="60" y="620" font-size="13" fill="#0a0a0a" font-weight="600">六步闭环、真正跑在软总线上的分布式系统——不是两个程序各干各的。</text>
</svg>
