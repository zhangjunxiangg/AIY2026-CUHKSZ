<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'JetBrains Mono','IBM Plex Mono','SF Mono','Consolas',ui-monospace,monospace">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#fafaf8"/>

  <!-- 标题 -->
  <text x="60" y="56" font-size="13" letter-spacing="2.4" fill="#0a0a0a" opacity="0.55" text-transform="uppercase">METRIC · INGESTIBLE EXPOSURE TIME</text>
  <text x="60" y="92" font-size="30" font-weight="700" fill="#0a0a0a" letter-spacing="0.5">可吞入物暴露时长（IET）</text>

  <!-- 坐标轴 -->
  <g stroke="#0a0a0a" stroke-width="1.5">
    <line x1="90" y1="440" x2="900" y2="440" marker-end="url(#arrow-ink)"/>
    <line x1="90" y1="440" x2="90" y2="130" marker-end="url(#arrow-ink)"/>
  </g>
  <text x="905" y="445" font-size="13" fill="#0a0a0a" opacity="0.7">时间 →</text>
  <text x="90" y="120" font-size="13" fill="#0a0a0a" opacity="0.7" text-anchor="middle">暴露件数</text>

  <!-- Y 轴 0 刻度 -->
  <line x1="86" y1="440" x2="94" y2="440" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="76" y="444" font-size="12" fill="#0a0a0a" opacity="0.55" text-anchor="end">0</text>

  <!-- ============ 左侧：现在（无产品）—— 无界持续攀升，未知何时被发现 ============ -->
  <g>
    <path d="M 130 400 L 340 190" stroke="#0a0a0a" stroke-width="2.5" fill="none" opacity="0.35" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text x="150" y="210" font-size="13" fill="#0a0a0a" opacity="0.5">现在：无人巡查 → 暴露时长未知</text>
    <text x="150" y="230" font-size="12" fill="#0a0a0a" opacity="0.4">（可能几小时，直到偶然发现）</text>
    <circle cx="340" cy="190" r="4" fill="#0a0a0a" opacity="0.35"/>
    <text x="352" y="184" font-size="11" fill="#0a0a0a" opacity="0.45">？</text>
  </g>

  <!-- 分隔虚线 -->
  <line x1="395" y1="130" x2="395" y2="440" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>
  <text x="395" y="118" font-size="12" fill="#0a0a0a" opacity="0.5" text-anchor="middle">拾安 Gauge 介入 →</text>

  <!-- ============ 右侧：有产品 —— 锯齿波，每次作业归零 ============ -->
  <!-- 三个齿：上升代表暴露件数累积，垂直下落代表一次作业清零 -->
  <g stroke="#002FA7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="
      M 420 440
      L 555 300
      L 555 440
      L 690 300
      L 690 440
      L 825 300
      L 825 440
      L 900 380
    "/>
  </g>

  <!-- 齿峰标记点 -->
  <g fill="#002FA7">
    <circle cx="555" cy="300" r="4.5"/>
    <circle cx="690" cy="300" r="4.5"/>
    <circle cx="825" cy="300" r="4.5"/>
  </g>

  <!-- 归零点标记（作业发生） -->
  <g fill="#0a0a0a">
    <circle cx="555" cy="440" r="3.5"/>
    <circle cx="690" cy="440" r="3.5"/>
    <circle cx="825" cy="440" r="3.5"/>
  </g>
  <text x="555" y="462" font-size="11" fill="#0a0a0a" opacity="0.6" text-anchor="middle">作业 1</text>
  <text x="690" y="462" font-size="11" fill="#0a0a0a" opacity="0.6" text-anchor="middle">作业 2</text>
  <text x="825" y="462" font-size="11" fill="#0a0a0a" opacity="0.6" text-anchor="middle">作业 3</text>

  <!-- 上限横线 -->
  <line x1="420" y1="300" x2="900" y2="300" stroke="#002FA7" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>
  <text x="900" y="292" font-size="12" fill="#002FA7" opacity="0.8" text-anchor="end">硬性上限：两次作业的间隔</text>

  <!-- 区间标注（作业1→作业2 间隔） -->
  <g stroke="#0a0a0a" stroke-width="1" opacity="0.6">
    <line x1="555" y1="480" x2="690" y2="480"/>
    <line x1="555" y1="474" x2="555" y2="486"/>
    <line x1="690" y1="474" x2="690" y2="486"/>
  </g>
  <text x="622" y="500" font-size="12" fill="#0a0a0a" opacity="0.75" text-anchor="middle" font-weight="600">暴露时长上限 = 两次作业间隔</text>

  <!-- 底部小结 -->
  <text x="60" y="520" font-size="12" fill="#0a0a0a" opacity="0.45">给"地面对婴幼儿的危险程度"造一把尺 —— 全案最原创的一张</text>
</svg>
