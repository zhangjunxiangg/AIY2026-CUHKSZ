nodes:
  - id: sensor
    path: /data/local/robot/sensor_node.py
    inputs:
      tick: dora/timer/millis/200
    outputs:
      - raw
    env:
      LD_PRELOAD: /data/local/release/usr/lib/libpython3.12.so.1.0
      PYTHONUNBUFFERED: "1"

  - id: filter
    path: /data/local/robot/filter_node.py
    inputs:
      raw: sensor/raw
    outputs:
      - smoothed
    env:
      LD_PRELOAD: /data/local/release/usr/lib/libpython3.12.so.1.0
      PYTHONUNBUFFERED: "1"
